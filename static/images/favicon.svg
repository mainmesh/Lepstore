<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="6" fill="url(#favGradient)"/>
  
  <!-- Simplified shopping bag -->
  <rect x="9" y="11" width="14" height="14" rx="1.5" fill="white" opacity="0.25"/>
  
  <!-- Handle -->
  <path d="M12 11 L12 9.5 C12 7.5 14 6 16 6 C18 6 20 7.5 20 9.5 L20 11" 
        stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  
  <!-- Center dot with connections -->
  <circle cx="16" cy="17" r="2" fill="white"/>
  <line x1="16" y1="19" x2="16" y2="23" stroke="white" stroke-width="1.2"/>
  <line x1="12" y1="21" x2="20" y2="21" stroke="white" stroke-width="1.2"/>
  <circle cx="12" cy="21" r="1" fill="white"/>
  <circle cx="20" cy="21" r="1" fill="white"/>
</svg>
