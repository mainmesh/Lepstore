<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <g id="headphone" transform="translate(250,200)">
    <!-- Band -->
    <path d="M-140,-40 C-120,-120 120,-120 140,-40" fill="none" stroke="#1e3a8a" stroke-width="18" stroke-linecap="round" />

    <!-- Left earcup -->
    <g id="left-earcup" transform="translate(-140,20)">
      <circle cx="0" cy="0" r="60" fill="#0ea5e9" />
      <circle cx="0" cy="0" r="40" fill="#fff" opacity="0.08" />
    </g>

    <!-- Right earcup -->
    <g id="right-earcup" transform="translate(140,20)">
      <circle cx="0" cy="0" r="60" fill="#0ea5e9" />
      <circle cx="0" cy="0" r="40" fill="#fff" opacity="0.08" />
    </g>
  </g>
</svg>
