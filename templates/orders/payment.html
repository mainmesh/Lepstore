{% extends 'base.html' %}

{% block title %}Payment - Lepstore{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">Complete Payment</h1>
        
        <div class="bg-white rounded-lg shadow p-8 mb-6">
            <div class="mb-6">
                <h2 class="text-xl font-bold mb-2">Order #{{ order.order_number }}</h2>
                <p class="text-3xl font-bold text-blue-600">${{ order.total }}</p>
            </div>
            
            <!-- Stripe Payment Element Placeholder -->
            <div id="payment-element" class="mb-6">
                <!-- Stripe.js will inject payment form here -->
                <p class="text-gray-600">Loading payment form...</p>
            </div>
            
            <button id="submit-payment" class="w-full btn-primary">
                <i class="fas fa-lock mr-2"></i>Pay Now
            </button>
            
            <p class="text-xs text-gray-600 text-center mt-4">
                <i class="fas fa-shield-alt mr-1"></i>
                Your payment information is secure and encrypted
            </p>
        </div>
    </div>
</div>

<script src="https://js.stripe.com/v3/"></script>
<script>
// Stripe integration
const stripe = Stripe('{{ stripe_public_key }}');

// Initialize payment (simplified - implement full Stripe Elements in production)
document.getElementById('submit-payment').addEventListener('click', function() {
    // Redirect to success page (implement actual Stripe payment flow)
    window.location.href = "{% url 'orders:payment_success' order.id %}";
});
</script>
{% endblock %}
