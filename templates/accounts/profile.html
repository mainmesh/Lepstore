{% extends 'base.html' %}

{% block title %}My Profile - Lepstore{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">My Profile</h1>
        
        <div class="bg-white rounded-lg shadow p-8 mb-6">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-6">
                    <label class="block font-semibold mb-2">Username</label>
                    {{ form.username }}
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block font-semibold mb-2">First Name</label>
                        {{ form.first_name }}
                    </div>
                    <div>
                        <label class="block font-semibold mb-2">Last Name</label>
                        {{ form.last_name }}
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block font-semibold mb-2">Email</label>
                    {{ form.email }}
                </div>
                
                <button type="submit" class="btn-primary">
                    Update Profile
                </button>
            </form>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <a href="{% url 'orders:order_history' %}" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition text-center">
                <i class="fas fa-shopping-bag text-4xl text-blue-600 mb-3"></i>
                <h3 class="font-bold text-lg">Order History</h3>
                <p class="text-gray-600 text-sm">View your past orders</p>
            </a>
            
            <a href="#" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition text-center">
                <i class="fas fa-heart text-4xl text-red-600 mb-3"></i>
                <h3 class="font-bold text-lg">Wishlist</h3>
                <p class="text-gray-600 text-sm">Your saved items</p>
            </a>
        </div>
    </div>
</div>
{% endblock %}
