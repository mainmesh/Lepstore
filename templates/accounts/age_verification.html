{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto p-6 bg-white rounded shadow">
  <h2 class="text-2xl font-bold mb-4">Age Verification</h2>
  <p class="mb-4">To continue purchasing regulated cannabis products you must confirm your date of birth (Nyeri law: 18+).</p>
  <form method="post">
    {% csrf_token %}
    <label for="dob" class="block mb-2">Date of birth</label>
    <input type="date" id="dob" name="dob" class="w-full border rounded p-2 mb-4" required />
    <input type="hidden" name="next" value="{{ next }}" />
    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded">Verify age</button>
  </form>
</div>
{% endblock %}
