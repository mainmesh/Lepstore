{% extends "admin/index.html" %}
{% load static admin_extras %}

{% block content %}
    {% admin_quick_stats %}

    <div style="margin-bottom: 20px;">
        <a class="cta-button" href="{% url 'admin_dashboard' %}" style="
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.18);
            transition: all 0.22s ease;
        " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 26px rgba(102, 126, 234, 0.24)';" 
           onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 6px 20px rgba(102, 126, 234, 0.18)';">
            📊 View Analytics Dashboard
        </a>
    </div>

    {{ block.super }}
{% endblock %}
